[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moss-colab-studio"
version = "0.1.0.dev0"
description = "Colab + ComfyUI + Gradio image creation workbench"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["gradio==6.31.0", "aiohttp==3.14.5", "Pillow==11.3.0"]

[project.scripts]
moss-studio = "moss_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gpu: requires a real L4 and pinned model artifacts"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Pin classification so import order does not depend on what is checked out nearby.
known-first-party = ["moss_studio"]
known-third-party = ["gradio"]
